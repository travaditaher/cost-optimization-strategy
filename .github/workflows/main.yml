name: GCP Federation Test
on: [push]

permissions:
  contents: 'read'
  id-token: 'write' # REQUIRED for Federation

jobs:
  test-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to GCP'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/637345843557/locations/global/workloadIdentityPools/github-pool/providers/github'
          service_account: 'github-sa@gemini-enterprise-poc-494123.iam.gserviceaccount.com'

      - name: 'List Buckets'
        run: gcloud storage ls
